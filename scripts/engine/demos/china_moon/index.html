<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国登月计划 · huashu-art-motion 原生动画</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;background:#040913;color:#edf5ff}
*{box-sizing:border-box}body{margin:0;padding:28px 20px 42px;background:radial-gradient(circle at 50% 25%,#102640 0,#040913 72%);min-height:100vh}
main{max-width:1200px;margin:auto}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{color:#64edcf;font-size:12px;letter-spacing:.22em;font-weight:700}
h1{font-size:clamp(23px,3.5vw,36px);line-height:1.28;margin:8px 0}
.subtitle{color:#a6bbd3;font-size:14px;line-height:1.75;max-width:650px}
.repo{color:#a8d9ff;text-decoration:none;border:1px solid #2b4d6a;border-radius:12px;padding:11px 16px;font-size:13px}
.player{border-radius:22px;overflow:hidden;background:#02060e;border:1px solid #23435a;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.screen{aspect-ratio:16/9;position:relative;overflow:hidden;background:#020813;width:100%}
iframe{width:1280px;height:720px;border:0;position:absolute;left:0;top:0;transform-origin:top left;pointer-events:none}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,8,19,.85);color:#9fc3db;font-size:14px;text-align:center;padding:24px}
.controls{padding:16px 20px 17px;display:grid;gap:12px;background:rgba(8,21,37,.95)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.actions{display:flex;align-items:center;gap:12px}button{background:#103352;color:#eff8ff;border:1px solid #3975aa;border-radius:11px;padding:10px 18px;cursor:pointer;font:600 14px inherit}
button:hover{background:#17496f}button:disabled{opacity:.3;cursor:wait}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:#a5b7c9}
#seek{width:100%;accent-color:#74c5ff;cursor:pointer}
.scene-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.scene-list button{border:1px solid #28445d;background:#091b2c;color:#a5c9e8;padding:8px 12px;border-radius:999px;font-size:12px}
.scene-list button.active{background:#143d58;color:#fff;border-color:#5599cd}
small{display:block;margin:16px 2px;color:#7592a8;line-height:1.8}
</style></head>
<body><main>
<header><div><div class="eyebrow">HUASHU ART MOTION · ORIGINAL ENGINE</div>
<h1>中国登月计划 · 52 秒程序动画</h1>
<div class="subtitle">调用原仓库 clip.html、clip.js、lib/motion.js、lib/typo.js 和 clips/china_moon.js。不是独立重写的 Canvas Demo。</div></div>
<a class="repo" href="https://github.com/DoThingsWithAI/huashu-art-motion" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></header>
<div class="player"><div class="screen" id="screen">
<iframe id="engine" scrolling="no" title="huashu-art-motion 原生动画播放画布"
src="../../clip.html?render=1&amp;spec=examples/china_moon_2026.json"></iframe>
<div class="cover" id="cover">正在加载原项目动画引擎与字体…</div></div>
<div class="controls">
<div class="bar"><div class="actions">
<button id="toggle" disabled>播放</button><button id="restart" disabled>从头播放</button>
</div><span class="time"><span id="clock">00:00</span> / 00:52</span></div>
<input id="seek" aria-label="动画进度" type="range" min="0" max="52" step="0.01" value="0" disabled>
</div></div><div class="scene-list" id="scenes"></div>
<small>点击「播放」开始，拖动进度条可逐帧检查。浏览器预览不带音轨；用仓库原生 render.py 可以导出 MP4。所有轨道和航天器图形均为科普示意，不代表实际飞行比例或精确结构。资料截至 2026-10-09。</small>
</main><script>
const iframe=document.getElementById('engine'), screen=document.getElementById('screen'),
cover=document.getElementById('cover'), toggle=document.getElementById('toggle'),restart=document.getElementById('restart'),
seek=document.getElementById('seek'),clock=document.getElementById('clock'),scenes=document.getElementById('scenes');
const DUR=52; let playing=false,time=0,last=0,ready=false,chapters=[];
const clockText=x=>'00:'+String(Math.floor(x)).padStart(2,'0');
const inner=()=>iframe.contentWindow;
function resize(){const w=screen.clientWidth;iframe.style.transform='scale('+(w/1280)+')'}
window.addEventListener('resize',resize);resize();
function render(){if(!ready)return;inner().renderFrame(Math.max(0,Math.min(DUR-.001,time)));seek.value=time.toFixed(2);clock.textContent=clockText(time);
Array.from(scenes.children).forEach((node,i)=>node.classList.toggle('active',i===chapters.findLastIndex(q=>q.at<=time)))}
function setTime(v){time=Math.max(0,Math.min(DUR,Number(v)||0));render()}
function setPlaying(value){playing=value;last=performance.now();toggle.textContent=playing?'暂停':'播放'}
toggle.onclick=()=>setPlaying(!playing);
restart.onclick=()=>{setTime(0);setPlaying(true)};
seek.addEventListener('input',()=>{setPlaying(false);setTime(seek.value)});
async function loadChapters(){const spec=await(await fetch('../../examples/china_moon_2026.json')).json();
chapters=(spec.cues||[]).filter(q=>q.kind==='stage');
chapters.forEach(q=>{const b=document.createElement('button');b.textContent=q.text;b.onclick=()=>{setTime(q.at);setPlaying(true)};scenes.appendChild(b)})}
loadChapters().catch(e=>{console.warn('分镜导航读取失败',e)});
function tick(now){if(ready&&playing){const dt=Math.min((now-last)/1000,.15);time+=dt;if(time>=DUR)time%=DUR;render()}last=now;requestAnimationFrame(tick)}
requestAnimationFrame(tick);
function poll(){let w;try{w=inner()}catch(e){return}if(w&&w.__bootFailed){cover.textContent='动画引擎初始化失败：'+w.__bootFailed;return}
if(w&&w.__ready&&typeof w.renderFrame==='function'){ready=true;cover.style.display='none';seek.disabled=false;toggle.disabled=false;restart.disabled=false;render();setPlaying(true);return}
setTimeout(poll,130)}
iframe.addEventListener('load',poll);
setTimeout(poll,300);
</script></body></html>
